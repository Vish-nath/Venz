services:
  - type: web
    name: venz
    runtime: node
    rootDir: .
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
